<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f2937" />
    <title>VisualMD</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>VisualMD</h1>
    </header>

    <main class="editor-layout">
      <div class="editor-pane">
        <label class="visually-hidden" for="markdownInput">Markdown</label>
        <div class="md-overlay" id="mdOverlay" aria-hidden="true"></div>
        <textarea id="markdownInput" spellcheck="false" placeholder="# Inizia a scrivere...&#10;&#10;Supporta heading, liste, link, grassetto e corsivo."></textarea>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
